services:
  mysql:
    image: mysql:8.0
    container_name: liverpool-news-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-liverpool_news}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
